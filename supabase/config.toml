
[functions.advance-virtual-buoys]
enabled = true
verify_jwt = false
import_map = "./functions/advance-virtual-buoys/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/advance-virtual-buoys/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/advance-virtual-buoys/*.html" ]

[functions.public-api]
enabled = true
verify_jwt = false
entrypoint = './functions/public-api/index.ts'
