          "description": {
            "type": "string"
          },
          "unit": {
            "type": "string"
          },
          "relative": {
            "type": "boolean"
          },
          "direction_convention": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "from",
              "to",
              null
            ]
          },
          "depths_m": {
            "type": "array",
            "items": {
