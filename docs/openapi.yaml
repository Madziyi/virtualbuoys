              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data_source",
                    "buoy",
                    "parameters"
                  ],
                  "properties": {
                    "data_source": {
                      "type": "string",
                      "const": "synthetic"
                    },
                    "buoy": {
                      "$ref": "#/components/schemas/Buoy"
                    },
                    "parameters": {
                      "type": "array",
