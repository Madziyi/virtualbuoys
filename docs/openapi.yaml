    "/v1/buoys/{slug}/observations": {
      "get": {
        "summary": "Bounded history, oldest first",
        "parameters": [
          {
            "name": "slug",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "west",
                "central",
                "east"
              ]
            },
            "description": "Virtual buoy slug"
          },
          {
            "name": "parameter",
            "in": "query",
            "required": true,
            "description": "Public parameter key",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "hours",
            "in": "query",
            "required": false,
            "description": "Positive hours; defaults to 24; maximum 168. Do not combine with start/end.",
            "schema": {
              "type": "number",
              "exclusiveMinimum": 0,
              "maximum": 168
            }
          },
          {
            "name": "start",
            "in": "query",
            "required": false,
            "description": "UTC ISO timestamp; requires end.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "end",
            "in": "query",
            "required": false,
            "description": "UTC ISO timestamp; requires start.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "depth_m",
            "in": "query",
            "required": false,
            "description": "Available depth in metres.",
            "schema": {
              "type": "number"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Synthetic educational data",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data_source",
                    "buoy",
                    "parameter",
                    "range",
                    "observations"
                  ],
                  "properties": {
                    "data_source": {
                      "type": "string",
                      "const": "synthetic"
                    },
                    "buoy": {
                      "$ref": "#/components/schemas/Buoy"
                    },
                    "parameter": {
                      "$ref": "#/components/schemas/Parameter"
                    },
                    "range": {
                      "type": "object",
                      "required": [
                        "start",
                        "end"
                      ],
                      "properties": {
                        "start": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "end": {
                          "type": "string",
                          "format": "date-time"
                        }
                      }
                    },
                    "observations": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Observation"
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Structured error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
