    "/v1/buoys/{slug}/latest": {
      "get": {
        "summary": "Latest readings",
        "parameters": [
          {
            "name": "slug",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "west",
                "central",
                "east"
              ]
            },
            "description": "Virtual buoy slug"
          }
        ],
        "responses": {
          "200": {
            "description": "Synthetic educational data",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data_source",
                    "buoy",
                    "observations"
                  ],
                  "properties": {
                    "data_source": {
                      "type": "string",
                      "const": "synthetic"
                    },
                    "buoy": {
                      "$ref": "#/components/schemas/Buoy"
                    },
                    "observations": {
                      "type": "array",
                      "items": {
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/Observation"
                          },
                          {
                            "type": "object",
                            "required": [
                              "parameter"
                            ],
                            "properties": {
                              "parameter": {
                                "$ref": "#/components/schemas/Parameter"
                              }
                            }
                          }
                        ]
                      }
                    }
