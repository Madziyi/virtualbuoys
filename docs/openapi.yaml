      "get": {
        "summary": "Service health",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Synthetic educational data",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status",
                    "service",
                    "api_version",
                    "data_source"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ok"
                    },
                    "service": {
                      "type": "string"
                    },
                    "api_version": {
                      "type": "string"
                    },
                    "data_source": {
                      "type": "string",
                      "const": "synthetic"
                    }
                  }
                },
                "example": {
                  "status": "ok",
                  "service": "virtual-buoys",
                  "api_version": "v1",
                  "data_source": "synthetic"
                }
              }
            }
          },
          "400": {
            "description": "Structured error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
