{
  "openapi": "3.1.0",
  "info": {
    "title": "Virtual Buoys public API",
    "version": "1.0.0",
    "description": "Synthetic educational data, updated every 10 minutes. Wind and wave directions are FROM; current direction is TO. CDOM is a relative synthetic signal, not an absolute concentration. GET/OPTIONS CORS allows any origin without credentials. Metadata caches for 3600 seconds; latest and history for 60 seconds; health for 30 seconds."
  },
  "servers": [
    {
      "url": "https://dbsuryesimzatxhznurh.supabase.co/functions/v1/public-api"
    }
  ],
